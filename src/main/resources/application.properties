spring.application.name=${SPRING_APPLICATION_NAME}

server.port=${SERVER_PORT}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
pulseras.openapi.dev-url=${PULSERAS_OPENAPI_DEV_URL:http://localhost:2764}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

google.client-id=${GOOGLE_CLIENT_ID}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
reset.token.expiry=${RESET_TOKEN_EXPIRY}

payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.webhook-url=${PAYOS_WEBHOOK_URL}

cloud.aws.credentials.access-key=${CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${CLOUD_AWS_CREDENTIALS_SECRET_KEY}
cloud.aws.region.static=${CLOUD_AWS_REGION_STATIC}
cloud.aws.stack.auto=${CLOUD_AWS_STACK_AUTO}

application.bucket.name=${APPLICATION_BUCKET_NAME}
